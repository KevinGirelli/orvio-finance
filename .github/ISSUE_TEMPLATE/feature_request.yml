name: Feature request
description: Suggest a capability for the local-first finance app.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Features that need a central Orvio server, telemetry, or a shared developer API key are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The screen or workflow, and what is painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
      description: A sketch of the behaviour. Say whether it must work offline.
    validations:
      required: true
  - type: dropdown
    id: data-leaves-device
    attributes:
      label: Would this send data off the device?
      options:
        - No, it stays on the device
        - Only if the user opts in
        - Not sure
    validations:
      required: true
